<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>카메라</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 카메라 화면 -->
    <div id="cameraScreen" class="screen active">

        <video id="cameraPreview" autoplay playsinline muted></video>

        <!-- 카메라가 꺼졌을 때 -->
        <div id="cameraOffScreen" class="camera-off hidden">
            <div class="off-icon">📷</div>
            <div>카메라가 꺼져 있습니다</div>
        </div>

        <!-- 카메라 오류 -->
        <div id="cameraError" class="camera-error hidden">
            <div id="cameraErrorText">카메라를 사용할 수 없습니다.</div>
            <button id="retryCameraButton">다시 시도</button>
        </div>

        <!-- 상단 -->
        <div class="top-bar">

            <button id="cameraPowerButton" class="top-button">
                ⏻
            </button>

            <div id="zoomIndicator" class="zoom-indicator">
                1.0×
            </div>

            <button id="switchCameraButton" class="top-button">
                🔄
            </button>

        </div>

        <!-- 줌 -->
        <div id="zoomControl" class="zoom-control">
            <span>1×</span>

            <input
                id="zoomSlider"
                type="range"
                min="1"
                max="5"
                step="0.1"
                value="1"
            >

            <span>5×</span>
        </div>

        <!-- 하단 카메라 컨트롤 -->
        <div class="camera-controls">

            <button id="galleryButton" class="gallery-open-button">
                <span>🖼️</span>
                <small>갤러리</small>
            </button>

            <button id="captureButton" class="capture-button">
                <span></span>
            </button>

            <div class="control-space"></div>

        </div>

    </div>


    <!-- 갤러리 -->
    <div id="galleryScreen" class="screen">

        <div class="gallery-header">

            <button id="galleryBackButton" class="header-button">
                ←
            </button>

            <h1>갤러리</h1>

            <div class="header-space"></div>

        </div>

        <div id="galleryGrid" class="gallery-grid"></div>

        <div id="emptyGallery" class="empty-gallery">
            <div class="empty-icon">🖼️</div>
            <p>촬영한 사진이 없습니다.</p>
        </div>

    </div>


    <!-- 사진 크게 보기 -->
    <div id="photoViewer" class="photo-viewer hidden">

        <div class="viewer-top">

            <button id="viewerCloseButton" class="viewer-button">
                ✕
            </button>

            <div id="viewerZoomText">
                1.0×
            </div>

            <button id="deletePhotoButton" class="viewer-button delete-button">
                🗑️
            </button>

        </div>


        <!-- 사진 영역 -->
        <div id="photoZoomArea" class="photo-zoom-area">

            <img id="viewerImage" src="" alt="사진">

        </div>


        <!-- 확대/축소 -->
        <div class="viewer-controls">

            <button id="zoomOutButton" class="viewer-zoom-button">
                −
            </button>

            <button id="resetZoomButton" class="viewer-reset-button">
                원본
            </button>

            <button id="zoomInButton" class="viewer-zoom-button">
                ＋
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
