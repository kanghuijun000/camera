<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>카메라 앱</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. 카메라 화면 -->
  <div id="cameraScreen" class="screen active">
    <!-- 카메라 뷰파인더 -->
    <video id="cameraPreview" autoplay playsinline muted></video>

    <!-- 카메라 ON 상태 UI -->
    <div id="cameraUI">
      <!-- 상단 컨트롤 (전원 버튼, 줌 인디케이터) -->
      <div class="top-bar">
        <button id="cameraPowerButton" class="top-button" aria-label="카메라 끄기">⏻</button>
        <div id="cameraZoomIndicator" class="zoom-indicator">1.0×</div>
        <div class="top-bar-spacer"></div>
      </div>

      <!-- 하단/측면 컨트롤 (갤러리, 셔터/연사, 카메라 전환) -->
      <div class="camera-controls">
        <!-- 갤러리 버튼 -->
        <button id="galleryButton" class="gallery-open-button" aria-label="갤러리 열기">
          🖼️
          <small>갤러리</small>
        </button>

        <!-- 셔터 버튼 (연사 카운터 포함) -->
        <div class="shutter-container">
          <div id="burstCounter" class="burst-counter" style="display: none;">0/30</div>
          <button id="captureButton" class="capture-button" aria-label="촬영">
            <span></span>
          </button>
        </div>

        <!-- 전/후면 전환 버튼 -->
        <button id="switchCameraButton" class="top-button" aria-label="카메라 전환">🔄</button>
      </div>
    </div>

    <!-- 카메라 OFF 상태 -->
    <div id="cameraOffScreen" class="camera-off hidden">
      <button id="cameraPowerButtonOff" class="camera-power-off-button" aria-label="카메라 켜기">⏻</button>
    </div>

    <!-- 에러 표시 -->
    <div id="cameraError" class="camera-error hidden">
      <p id="cameraErrorText">카메라를 불러올 수 없습니다.</p>
      <button id="retryCameraButton">다시 시도</button>
    </div>
  </div>


  <!-- 2. 갤러리 화면 -->
  <div id="galleryScreen" class="screen">
    <div class="gallery-header">
      <button id="galleryBackButton" class="header-button" aria-label="뒤로가기">←</button>
      <h1>갤러리</h1>
      <button id="deleteAllButton" class="delete-all-button">전체 삭제</button>
    </div>

    <!-- 사진 그리드 -->
    <div id="galleryGrid" class="gallery-grid"></div>

    <!-- 빈 갤러리 및 로딩 안내 -->
    <div id="emptyGallery" class="empty-gallery hidden">
      <div class="empty-icon" id="emptyIcon">📷</div>
      <p id="emptyText">저장된 사진이 없습니다.</p>
    </div>
  </div>


  <!-- 3. 사진 상세보기 뷰어 -->
  <div id="photoViewer" class="photo-viewer hidden">
    <!-- 뷰어 상단 바 -->
    <div class="viewer-top">
      <button id="viewerCloseButton" class="viewer-button" aria-label="닫기">✕</button>
      <div class="viewer-top-right">
        <button id="viewerRotateButton" class="viewer-button rotate-button" aria-label="사진 회전">↻</button>
        <button id="downloadPhotoButton" class="viewer-button download-button" aria-label="다운로드">⬇</button>
        <button id="deletePhotoButton" class="viewer-button delete-button" aria-label="삭제">🗑</button>
      </div>
    </div>

    <!-- 이미지 및 줌 영역 -->
    <div id="photoZoomArea" class="photo-zoom-area">
      <img id="viewerImage" alt="상세 사진">
    </div>

    <!-- 뷰어 하단 줌 컨트롤 -->
    <div class="viewer-controls">
      <button id="zoomOutButton" class="viewer-zoom-button">-</button>
      <span id="viewerZoomText" style="color: white; font-size: 14px; font-weight: bold;">1.0×</span>
      <button id="zoomInButton" class="viewer-zoom-button">+</button>
      <button id="resetZoomButton" class="viewer-reset-button">초기화</button>
    </div>
  </div>

<script src="script.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {

      navigator.serviceWorker.register("./sw.js")
        .then((registration) => {

          console.log(
            "Service Worker 등록 완료:",
            registration.scope
          );

          // 주기적으로 새로운 Service Worker가 있는지 확인
          setInterval(() => {
            registration.update().catch(() => {});
          }, 30000);

          // 새로운 Service Worker가 발견되면 즉시 적용
          registration.addEventListener("updatefound", () => {

            const newWorker = registration.installing;

            if (!newWorker) {
              return;
            }

            newWorker.addEventListener("statechange", () => {

              if (
                newWorker.state === "installed" &&
                navigator.serviceWorker.controller
              ) {
                newWorker.postMessage({
                  type: "SKIP_WAITING"
                });
              }

            });
          });

        })
        .catch((error) => {
          console.error(
            "Service Worker 등록 실패:",
            error
          );
        });


      // 새로운 Service Worker가 적용되면
      // 현재 페이지를 자동으로 새로고침
      let refreshing = false;

      navigator.serviceWorker.addEventListener(
        "controllerchange",
        () => {

          if (refreshing) {
            return;
          }

          refreshing = true;
          window.location.reload();
        }
      );


      // ============================
      // 앱 파일 자동 변경 감지
      // ============================

      let initialFiles = null;

      async function getFileContents() {
        const timestamp = Date.now();

        const files = [
          "./index.html?update=" + timestamp,
          "./style.css?update=" + timestamp,
          "./script.js?update=" + timestamp
        ];

        const results = await Promise.all(
          files.map(async (file) => {

            const response = await fetch(
              file,
              {
                cache: "no-store"
              }
            );

            if (!response.ok) {
              throw new Error("업데이트 확인 실패");
            }

            return await response.text();
          })
        );

        return results;
      }


      async function checkForChanges() {

        try {

          const currentFiles = await getFileContents();

          // 최초 실행에서는 기준값만 저장
          if (!initialFiles) {
            initialFiles = currentFiles;
            return;
          }

          // 파일 내용이 하나라도 달라졌다면
          const changed =
            currentFiles[0] !== initialFiles[0] ||
            currentFiles[1] !== initialFiles[1] ||
            currentFiles[2] !== initialFiles[2];

          if (changed) {

            console.log(
              "새로운 앱 버전을 발견했습니다. 자동으로 업데이트합니다."
            );

            window.location.reload();
          }

        } catch (error) {

          // 인터넷이 잠시 끊긴 경우에는
          // 앱 사용을 방해하지 않음
          console.log(
            "업데이트 확인을 건너뜁니다."
          );

        }
      }


      // 최초 기준값 확인
      checkForChanges();

      // 10초마다 최신 파일 확인
      setInterval(
        checkForChanges,
        10000
      );

    });
  }
</script>

</body>
</html>
