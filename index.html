<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카메라 연속 촬영 (최적화)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100vh;
      padding-bottom: 40px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* 비디오 미리보기 */
    #cameraPreview {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* 촬영 컨트롤 하단 레이아웃 */
    .camera-controls {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 연속 촬영 실시간 카운터 (촬영 버튼 위에 아주 작게 표시) */
    .burst-counter {
      display: none; /* 평소에는 숨김 */
      position: absolute;
      top: -30px; /* 촬영 버튼 바로 위 */
      font-size: 12px; /* 아주 작은 글씨 */
      font-weight: 600;
      color: #ffffff;
      background-color: rgba(0, 0, 0, 0.6); /* 반투명 배경 */
      padding: 3px 8px;
      border-radius: 12px;
      letter-spacing: 0.5px;
      pointer-events: none; /* 터치/클릭 이벤트 방해 방지 */
      user-select: none;
      -webkit-user-select: none;
    }

    /* 셔터 버튼 */
    .shutter-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 4px solid #ffffff;
      background-color: transparent;
      cursor: pointer;
      outline: none;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      transition: transform 0.1s ease;
    }

    .shutter-btn:active {
      transform: scale(0.92);
    }
  </style>
</head>
<body>

  <!-- 카메라 비디오 출력 영역 -->
  <video id="cameraPreview" autoplay playsinline muted></video>

  <!-- 카메라 컨트롤 영역 -->
  <div class="camera-controls">
    <!-- 연속 촬영 카운터 (예: 1/30) -->
    <div id="burstCounter" class="burst-counter">0/30</div>
    
    <!-- 셔터 버튼 -->
    <button id="shutterBtn" class="shutter-btn" aria-label="촬영"></button>
  </div>

  <script>
    const MAX_BURST_COUNT = 30; // 최대 촬영 제한 수
    const BURST_INTERVAL = 150; // 연속 촬영 간격 (150ms)

    let burstCount = 0;
    let burstInterval = null;
    let holdTimer = null;

    // 카메라 및 캡처 관련 상태 변수
    let cameraStream = null;
    let cameraEnabled = false;
    let cameraZoom = 1;
    let cameraHardwareZoom = false;
    let currentFacingMode = "environment"; // "user" 또는 "environment"

    // 재사용 캔버스 및 연사 비트맵 임시 큐 (메모리 보관용)
    const reusableCanvas = document.createElement("canvas");
    const reusableContext = reusableCanvas.getContext("2d", { alpha: false });
    let burstBitmapQueue = [];

    const shutterBtn = document.getElementById('shutterBtn');
    const burstCounter = document.getElementById('burstCounter');
    const cameraPreview = document.getElementById('cameraPreview');

    /* =========================================================
       카메라 시작 (MediaDevices API)
    ========================================================= */
    async function startCamera() {
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacingMode, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        cameraPreview.srcObject = cameraStream;
        cameraEnabled = true;
      } catch (err) {
        console.error("카메라 접근 실패:", err);
      }
    }
    startCamera();

    /* =========================================================
       더미 저장 함수 (실제 IndexedDB/다운로드 저장 로직으로 교체)
    ========================================================= */
    async function savePhoto(blob) {
      // 사용자님의 실제 DB 저장 코드(IndexedDB 등)를 여기에 넣으시면 됩니다.
      return new Promise((resolve) => setTimeout(resolve, 10));
    }

    /* =========================================================
       최적화된 캡처 로직 (화질 1.0 유지 & 렉 제로)
    ========================================================= */

    // 1. 단발 촬영 (원본 화질 1.0)
    async function capturePhoto() {
      if (!cameraEnabled || !cameraStream || !cameraPreview.videoWidth) return;

      const videoWidth = cameraPreview.videoWidth;
      const videoHeight = cameraPreview.videoHeight;

      let sourceX = 0, sourceY = 0, sourceWidth = videoWidth, sourceHeight = videoHeight;

      if (!cameraHardwareZoom && cameraZoom > 1) {
        const cropRatio = 1 / cameraZoom;
        sourceWidth = videoWidth * cropRatio;
        sourceHeight = videoHeight * cropRatio;
        sourceX = (videoWidth - sourceWidth) / 2;
        sourceY = (videoHeight - sourceHeight) / 2;
      }

      reusableCanvas.width = sourceWidth;
      reusableCanvas.height = sourceHeight;

      if (currentFacingMode === "user") {
        reusableContext.save();
        reusableContext.translate(reusableCanvas.width, 0);
        reusableContext.scale(-1, 1);
      }

      reusableContext.drawImage(
        cameraPreview,
        sourceX, sourceY, sourceWidth, sourceHeight,
        0, 0, reusableCanvas.width, reusableCanvas.height
      );

      if (currentFacingMode === "user") {
        reusableContext.restore();
      }

      // 최고 화질(1.0) 저장
      reusableCanvas.toBlob(async function(blob) {
        if (!blob) return;
        try {
          await savePhoto(blob);
          cameraPreview.style.opacity = "0.4";
          setTimeout(() => { cameraPreview.style.opacity = "1"; }, 80);
        } catch (error) {
          console.error("사진 저장 실패", error);
        }
      }, "image/jpeg", 1.0);
    }

    // 2. 연사 전용 초고속 비트맵 캡처 (GPU 메모리에 1ms 만에 캡처 -> 렉 0%)
    async function captureBurstFrame() {
      if (!cameraEnabled || !cameraStream || !cameraPreview.videoWidth) return;

      try {
        const bitmap = await createImageBitmap(cameraPreview);
        burstBitmapQueue.push({
          bitmap: bitmap,
          zoom: cameraZoom,
          facingMode: currentFacingMode
        });
      } catch (e) {
        console.error("비트맵 캡처 실패", e);
      }
    }

    /* =========================================================
       연속 촬영 핸들러
    ========================================================= */

    function startBurstCapture() {
      burstCount = 0;
      burstBitmapQueue = []; // 메모리 큐 초기화
      
      burstCounter.textContent = `0/${MAX_BURST_COUNT}`;
      burstCounter.style.display = 'block';

      const executeCapture = () => {
        if (burstCount >= MAX_BURST_COUNT) {
          stopBurstCapture();
          return;
        }

        burstCount++;
        burstCounter.textContent = `${burstCount}/${MAX_BURST_COUNT}`;

        // 인코딩 없이 순수 이미지 데이터를 GPU 메모리에 즉시 보관
        captureBurstFrame();
      };

      executeCapture();
      burstInterval = setInterval(executeCapture, BURST_INTERVAL); // 150ms 간격 유지
    }

    async function stopBurstCapture() {
      if (burstInterval) {
        clearInterval(burstInterval);
        burstInterval = null;
      }
      
      burstCounter.style.display = 'none';

      // 촬영 종료 후 쌓여있는 이미지들을 원본 화질(1.0)로 변환하여 백그라운드 저장
      if (burstBitmapQueue.length > 0) {
        const queueToProcess = [...burstBitmapQueue];
        burstBitmapQueue = [];

        processAndSaveBurstQueue(queueToProcess);
      }
    }

    // 연사 완료 후 백그라운드 비동기 처리 함수 (화질 1.0 유지)
    async function processAndSaveBurstQueue(queue) {
      for (const item of queue) {
        const { bitmap, zoom, facingMode } = item;

        const videoWidth = bitmap.width;
        const videoHeight = bitmap.height;

        let sourceX = 0, sourceY = 0, sourceWidth = videoWidth, sourceHeight = videoHeight;

        if (!cameraHardwareZoom && zoom > 1) {
          const cropRatio = 1 / zoom;
          sourceWidth = videoWidth * cropRatio;
          sourceHeight = videoHeight * cropRatio;
          sourceX = (videoWidth - sourceWidth) / 2;
          sourceY = (videoHeight - sourceHeight) / 2;
        }

        reusableCanvas.width = sourceWidth;
        reusableCanvas.height = sourceHeight;

        if (facingMode === "user") {
          reusableContext.save();
          reusableContext.translate(reusableCanvas.width, 0);
          reusableContext.scale(-1, 1);
        }

        reusableContext.drawImage(
          bitmap,
          sourceX, sourceY, sourceWidth, sourceHeight,
          0, 0, reusableCanvas.width, reusableCanvas.height
        );

        if (facingMode === "user") {
          reusableContext.restore();
        }

        // 비트맵 메모리 해제
        bitmap.close();

        // 100% 원본 화질(1.0)로 인코딩 후 저장
        await new Promise((resolve) => {
          reusableCanvas.toBlob(async (blob) => {
            if (blob) {
              await savePhoto(blob);
            }
            resolve();
          }, "image/jpeg", 1.0);
        });
      }
      console.log(`[연사 완료] ${queue.length}장이 원본 화질(1.0)로 저장되었습니다.`);
    }

    /* =========================================================
       이벤트 핸들러 (마우스 / 터치 대응)
    ========================================================= */

    function handlePressStart(e) {
      e.preventDefault();
      
      // 200ms 이상 길게 누르면 연사 시작
      holdTimer = setTimeout(() => {
        startBurstCapture();
      }, 200);
    }

    function handlePressEnd(e) {
      e.preventDefault();

      if (holdTimer) {
        clearTimeout(holdTimer);
        holdTimer = null;
      }

      if (burstInterval) {
        stopBurstCapture();
      } else {
        // 짧게 클릭 시 단발 촬영
        capturePhoto();
      }
    }

    shutterBtn.addEventListener('touchstart', handlePressStart, { passive: false });
    shutterBtn.addEventListener('touchend', handlePressEnd, { passive: false });
    shutterBtn.addEventListener('mousedown', handlePressStart);
    shutterBtn.addEventListener('mouseup', handlePressEnd);
    shutterBtn.addEventListener('mouseleave', handlePressEnd);
  </script>

</body>
</html>
