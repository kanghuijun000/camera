<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>카메라 앱</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      color: #fff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* 비디오 뷰파인더 */
    .viewfinder-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #cameraPreview {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 상단 컨트롤 (플래시, 설정 등 확장용) */
    .top-controls {
      position: relative;
      z-index: 10;
      width: 100%;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
    }

    /* 하단 컨트롤 영역 */
    .bottom-controls {
      position: relative;
      z-index: 10;
      width: 100%;
      padding: 20px 30px 40px 30px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
    }

    /* 줌 슬라이더 / 컨트롤 영역 */
    .zoom-controls {
      position: relative;
      z-index: 10;
      margin-bottom: 15px;
      display: flex;
      gap: 10px;
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 16px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }

    .zoom-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      opacity: 0.7;
      padding: 2px 6px;
    }

    .zoom-btn.active {
      opacity: 1;
      color: #ffcc00;
    }

    /* Center shutter area */
    .shutter-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 연속 촬영 카운터 (버튼 위) */
    .burst-counter {
      display: none;
      position: absolute;
      top: -32px;
      font-size: 12px;
      font-weight: 600;
      color: #ffffff;
      background-color: rgba(0, 0, 0, 0.65);
      padding: 3px 10px;
      border-radius: 12px;
      letter-spacing: 0.5px;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      border: 1px solid rgba(255,255,255,0.2);
    }

    /* 셔터 버튼 */
    .shutter-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 4px solid #ffffff;
      background-color: transparent;
      cursor: pointer;
      outline: none;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      transition: transform 0.1s ease;
      position: relative;
    }

    .shutter-btn::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60px;
      height: 60px;
      background-color: #fff;
      border-radius: 50%;
      transition: transform 0.1s ease;
    }

    .shutter-btn:active::after {
      transform: translate(-50%, -50%) scale(0.88);
    }

    /* 사이드 버튼 (갤러리, 카메라 전환) */
    .side-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
      overflow: hidden;
    }

    .side-btn:active {
      transform: scale(0.95);
    }

    /* 갤러리 썸네일 미리보기 */
    .gallery-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .control-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      position: relative;
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- 카메라 뷰파인더 -->
  <div class="viewfinder-container">
    <video id="cameraPreview" autoplay playsinline muted></video>
  </div>

  <!-- 상단 바 -->
  <div class="top-controls">
    <span style="font-size: 14px; opacity: 0.8;">카메라</span>
  </div>

  <!-- 하단 제어 영역 -->
  <div class="control-wrapper">
    <!-- 줌 제어 -->
    <div class="zoom-controls">
      <button class="zoom-btn active" onclick="setZoom(1)">1x</button>
      <button class="zoom-btn" onclick="setZoom(2)">2x</button>
    </div>

    <!-- 하단 버튼들 (갤러리 / 셔터 / 카메라 전환) -->
    <div class="bottom-controls">
      <!-- 갤러리 버튼 -->
      <button class="side-btn" id="galleryBtn" aria-label="갤러리">
        <img id="galleryThumb" class="gallery-thumb" alt="최근 사진">
        <svg id="galleryIcon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
      </button>

      <!-- 셔터 버튼 & 카운터 -->
      <div class="shutter-container">
        <div id="burstCounter" class="burst-counter">0/30</div>
        <button id="shutterBtn" class="shutter-btn" aria-label="촬영"></button>
      </div>

      <!-- 전/후면 전환 버튼 -->
      <button class="side-btn" id="switchCameraBtn" aria-label="카메라 전환">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 10c0-4.418-3.582-8-8-8s-8 3.582-8 8e-8 4.418 3.582 8 8 8"></path>
          <path d="M4 14c0 4.418 3.582 8 8 8s8-3.582 8-8"></path>
          <polyline points="8 6 4 10 0 6"></polyline>
          <polyline points="16 18 20 14 24 18"></polyline>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const MAX_BURST_COUNT = 30;
    const BURST_INTERVAL = 150; // 150ms 연사 간격

    let burstCount = 0;
    let burstInterval = null;
    let holdTimer = null;

    let cameraStream = null;
    let cameraEnabled = false;
    let cameraZoom = 1;
    let currentFacingMode = "environment"; // 기본 후면

    const reusableCanvas = document.createElement("canvas");
    const reusableContext = reusableCanvas.getContext("2d", { alpha: false });
    let burstBitmapQueue = [];

    const shutterBtn = document.getElementById('shutterBtn');
    const burstCounter = document.getElementById('burstCounter');
    const cameraPreview = document.getElementById('cameraPreview');
    const switchCameraBtn = document.getElementById('switchCameraBtn');
    const galleryThumb = document.getElementById('galleryThumb');
    const galleryIcon = document.getElementById('galleryIcon');

    // 카메라 시작
    async function startCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
      }
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacingMode, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        cameraPreview.srcObject = cameraStream;
        cameraEnabled = true;
      } catch (err) {
        console.error("카메라 접근 실패:", err);
      }
    }
    startCamera();

    // 전/후면 전환
    switchCameraBtn.addEventListener('click', () => {
      currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
      startCamera();
    });

    // 줌 조절
    function setZoom(zoomValue) {
      cameraZoom = zoomValue;
      document.querySelectorAll('.zoom-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent === `${zoomValue}x`);
      });
    }

    // 사진 저장 및 썸네일 업데이트
    async function savePhoto(blob) {
      const url = URL.createObjectURL(blob);
      galleryThumb.src = url;
      galleryThumb.style.display = 'block';
      galleryIcon.style.display = 'none';
      return Promise.resolve();
    }

    // 단발 캡처 (화질 1.0 원본)
    async function capturePhoto() {
      if (!cameraEnabled || !cameraStream || !cameraPreview.videoWidth) return;

      const videoWidth = cameraPreview.videoWidth;
      const videoHeight = cameraPreview.videoHeight;

      let sourceWidth = videoWidth / cameraZoom;
      let sourceHeight = videoHeight / cameraZoom;
      let sourceX = (videoWidth - sourceWidth) / 2;
      let sourceY = (videoHeight - sourceHeight) / 2;

      reusableCanvas.width = sourceWidth;
      reusableCanvas.height = sourceHeight;

      if (currentFacingMode === "user") {
        reusableContext.save();
        reusableContext.translate(reusableCanvas.width, 0);
        reusableContext.scale(-1, 1);
      }

      reusableContext.drawImage(
        cameraPreview,
        sourceX, sourceY, sourceWidth, sourceHeight,
        0, 0, reusableCanvas.width, reusableCanvas.height
      );

      if (currentFacingMode === "user") {
        reusableContext.restore();
      }

      reusableCanvas.toBlob(async function(blob) {
        if (!blob) return;
        await savePhoto(blob);
        cameraPreview.style.opacity = "0.4";
        setTimeout(() => { cameraPreview.style.opacity = "1"; }, 80);
      }, "image/jpeg", 1.0);
    }

    // 초고속 비트맵 캡처 (GPU 메모리 직행 - 렉 0%)
    async function captureBurstFrame() {
      if (!cameraEnabled || !cameraStream || !cameraPreview.videoWidth) return;
      try {
        const bitmap = await createImageBitmap(cameraPreview);
        burstBitmapQueue.push({
          bitmap: bitmap,
          zoom: cameraZoom,
          facingMode: currentFacingMode
        });
      } catch (e) {
        console.error("비트맵 캡처 실패", e);
      }
    }

    // 연사 시작
    function startBurstCapture() {
      burstCount = 0;
      burstBitmapQueue = [];
      
      burstCounter.textContent = `0/${MAX_BURST_COUNT}`;
      burstCounter.style.display = 'block';

      const executeCapture = () => {
        if (burstCount >= MAX_BURST_COUNT) {
          stopBurstCapture();
          return;
        }

        burstCount++;
        burstCounter.textContent = `${burstCount}/${MAX_BURST_COUNT}`;
        captureBurstFrame();
      };

      executeCapture();
      burstInterval = setInterval(executeCapture, BURST_INTERVAL);
    }

    // 연사 정지
    async function stopBurstCapture() {
      if (burstInterval) {
        clearInterval(burstInterval);
        burstInterval = null;
      }
      
      burstCounter.style.display = 'none';

      if (burstBitmapQueue.length > 0) {
        const queueToProcess = [...burstBitmapQueue];
        burstBitmapQueue = [];
        processAndSaveBurstQueue(queueToProcess);
      }
    }

    // 연사 종료 후 원본 화질(1.0) 백그라운드 인코딩
    async function processAndSaveBurstQueue(queue) {
      for (const item of queue) {
        const { bitmap, zoom, facingMode } = item;

        const videoWidth = bitmap.width;
        const videoHeight = bitmap.height;

        let sourceWidth = videoWidth / zoom;
        let sourceHeight = videoHeight / zoom;
        let sourceX = (videoWidth - sourceWidth) / 2;
        let sourceY = (videoHeight - sourceHeight) / 2;

        reusableCanvas.width = sourceWidth;
        reusableCanvas.height = sourceHeight;

        if (facingMode === "user") {
          reusableContext.save();
          reusableContext.translate(reusableCanvas.width, 0);
          reusableContext.scale(-1, 1);
        }

        reusableContext.drawImage(
          bitmap,
          sourceX, sourceY, sourceWidth, sourceHeight,
          0, 0, reusableCanvas.width, reusableCanvas.height
        );

        if (facingMode === "user") {
          reusableContext.restore();
        }

        bitmap.close();

        await new Promise((resolve) => {
          reusableCanvas.toBlob(async (blob) => {
            if (blob) {
              await savePhoto(blob);
            }
            resolve();
          }, "image/jpeg", 1.0);
        });
      }
    }

    // 터치/마우스 이벤트 (길게 누르면 연사)
    function handlePressStart(e) {
      e.preventDefault();
      holdTimer = setTimeout(() => {
        startBurstCapture();
      }, 200);
    }

    function handlePressEnd(e) {
      e.preventDefault();

      if (holdTimer) {
        clearTimeout(holdTimer);
        holdTimer = null;
      }

      if (burstInterval) {
        stopBurstCapture();
      } else {
        capturePhoto();
      }
    }

    shutterBtn.addEventListener('touchstart', handlePressStart, { passive: false });
    shutterBtn.addEventListener('touchend', handlePressEnd, { passive: false });
    shutterBtn.addEventListener('mousedown', handlePressStart);
    shutterBtn.addEventListener('mouseup', handlePressEnd);
    shutterBtn.addEventListener('mouseleave', handlePressEnd);
  </script>

</body>
</html>
