<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>카메라 앱</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. 카메라 화면 -->
  <div id="cameraScreen" class="screen active">
    <video id="cameraPreview" autoplay playsinline muted></video>

    <div id="cameraUI">
      <div class="top-bar">
        <button id="cameraPowerButton" class="top-button" aria-label="카메라 끄기">⏻</button>
        <div id="cameraZoomIndicator" class="zoom-indicator">1.0×</div>
        <button id="videoModeButton" class="top-button video-mode-button" aria-label="동영상 모드">🎥</button>
        <div class="top-bar-spacer"></div>
      </div>

      <div class="camera-controls">

        <button id="galleryButton" class="gallery-open-button" aria-label="갤러리 열기">
          🖼️
          <small>갤러리</small>
        </button>

        <div class="shutter-container">
          <div id="videoTimer" class="video-timer" style="display: none;">00:00</div>
          <div id="burstCounter" class="burst-counter" style="display: none;">0/30</div>

          <button id="captureButton" class="capture-button" aria-label="촬영">
            <span></span>
          </button>
        </div>

        <button id="switchCameraButton" class="top-button" aria-label="카메라 전환">🔄</button>

      </div>
    </div>

    <div id="cameraOffScreen" class="camera-off hidden">
      <button id="cameraPowerButtonOff" class="camera-power-off-button" aria-label="카메라 켜기">⏻</button>
    </div>

    <div id="cameraError" class="camera-error hidden">
      <p id="cameraErrorText">카메라를 불러올 수 없습니다.</p>
      <button id="retryCameraButton">다시 시도</button>
    </div>
  </div>


  <!-- 2. 갤러리 화면 -->
  <div id="galleryScreen" class="screen">

    <div class="gallery-header">
      <button id="galleryBackButton" class="header-button" aria-label="뒤로가기">←</button>
      <h1>갤러리</h1>
      <button id="deleteAllButton" class="delete-all-button">전체 삭제</button>
    </div>

    <div class="gallery-filter-sidebar">
      <button id="galleryAllButton" class="gallery-filter-button active" aria-label="전체">전체</button>
      <button id="galleryPhotoButton" class="gallery-filter-button" aria-label="사진">사진</button>
      <button id="galleryVideoButton" class="gallery-filter-button" aria-label="동영상">동영상</button>
    </div>

    <div id="galleryGrid" class="gallery-grid"></div>

    <div id="emptyGallery" class="empty-gallery hidden">
      <div class="empty-icon" id="emptyIcon">📷</div>
      <p id="emptyText">저장된 사진이 없습니다.</p>
    </div>

  </div>


  <!-- 3. 사진 / 동영상 상세보기 -->
  <div id="photoViewer" class="photo-viewer hidden">

    <div class="viewer-top">
      <button id="viewerCloseButton" class="viewer-button" aria-label="닫기">✕</button>

      <div class="viewer-top-right">
        <button id="viewerRotateButton" class="viewer-button rotate-button" aria-label="사진 회전">↻</button>
        <button id="downloadPhotoButton" class="viewer-button download-button" aria-label="다운로드">⬇</button>
        <button id="deletePhotoButton" class="viewer-button delete-button" aria-label="삭제">🗑</button>
      </div>
    </div>


    <div id="photoZoomArea" class="photo-zoom-area">
      <img id="viewerImage" alt="상세 사진">
      <video id="viewerVideo" class="viewer-video" playsinline preload="auto"></video>
    </div>


    <!-- 동영상 탐색 바 -->
    <div id="videoTimelineWrap" class="video-timeline-wrap hidden">

      <!-- 현재 재생 위치 표시 -->
      <div id="videoCurrentTimeLabel" class="video-current-time-label">00:00</div>

      <!-- 진행 바 -->
      <input
        id="videoTimeline"
        class="video-timeline"
        type="range"
        min="0"
        max="100"
        value="0"
        step="0.1"
        aria-label="동영상 재생 위치"
      >

      <!-- 시작 시간 -->
      <div id="videoTimelineStartLabel" class="video-timeline-start-label">00:00</div>

      <!-- 전체 동영상 길이 -->
      <div id="videoTimelineDurationLabel" class="video-timeline-duration-label">00:00</div>

    </div>


    <div class="viewer-controls">

      <button
        id="videoPlayButton"
        class="video-play-button hidden"
        aria-label="동영상 재생"
      >▶</button>

      <button id="zoomOutButton" class="viewer-zoom-button">-</button>

      <span
        id="viewerZoomText"
        style="color: white; font-size: 14px; font-weight: bold;"
      >1.0×</span>

      <button id="zoomInButton" class="viewer-zoom-button">+</button>

      <button id="resetZoomButton" class="viewer-reset-button">초기화</button>

    </div>

  </div>


<script src="script.js"></script>


<script>
  if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

      navigator.serviceWorker.register("./sw.js")
        .then((registration) => {

          console.log(
            "Service Worker 등록 완료:",
            registration.scope
          );

          setInterval(() => {
            registration.update().catch(() => {});
          }, 30000);


          registration.addEventListener("updatefound", () => {

            const newWorker = registration.installing;

            if (!newWorker) {
              return;
            }

            newWorker.addEventListener("statechange", () => {

              if (
                newWorker.state === "installed" &&
                navigator.serviceWorker.controller
              ) {

                newWorker.postMessage({
                  type: "SKIP_WAITING"
                });

              }

            });

          });

        })
        .catch((error) => {

          console.error(
            "Service Worker 등록 실패:",
            error
          );

        });


      let refreshing = false;

      navigator.serviceWorker.addEventListener(
        "controllerchange",
        () => {

          if (refreshing) {
            return;
          }

          refreshing = true;
          window.location.reload();

        }
      );


      let initialFiles = null;


      async function getFileContents() {

        const timestamp = Date.now();

        const files = [
          "./index.html?update=" + timestamp,
          "./style.css?update=" + timestamp,
          "./script.js?update=" + timestamp
        ];

        const results = await Promise.all(
          files.map(async (file) => {

            const response = await fetch(
              file,
              {
                cache: "no-store"
              }
            );

            if (!response.ok) {
              throw new Error("업데이트 확인 실패");
            }

            return await response.text();

          })
        );

        return results;

      }


      async function checkForChanges() {

        try {

          const currentFiles = await getFileContents();

          if (!initialFiles) {
            initialFiles = currentFiles;
            return;
          }

          const changed =
            currentFiles[0] !== initialFiles[0] ||
            currentFiles[1] !== initialFiles[1] ||
            currentFiles[2] !== initialFiles[2];

          if (changed) {

            console.log(
              "새로운 앱 버전을 발견했습니다. 자동으로 업데이트합니다."
            );

            window.location.reload();

          }

        } catch (error) {

          console.log(
            "업데이트 확인을 건너뜁니다."
          );

        }

      }


      checkForChanges();

      setInterval(
        checkForChanges,
        10000
      );

    });

  }
</script>

</body>
</html>
